[package]
name = "shared"
version = "0.1.0"
edition = "2021"
description = "Open façade over closed pusa-core cdylib"

[dependencies]
protocol = { path = "../protocol" }
anyhow = "1"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
once_cell = "1"
