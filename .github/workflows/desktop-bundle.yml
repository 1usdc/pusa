name: Desktop Bundle

# 触发方式：
#   1) Actions 手动 / just release-mac|release-windows|desktop-ship（workflow_dispatch）
#   2) 推 tag `desktop-v*` → 双平台构建并发 Release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台：all | mac | windows"
        required: true
        type: choice
        options:
          - all
          - mac
          - windows
        default: all
      release_tag:
        description: "发版 tag（如 desktop-v1.2.3）；留空只上传 artifact"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write # Release 上传产物时需要
  id-token: write # Azure Trusted Signing 走 OIDC 联邦凭证（azure/login@v2 要求）

env:
  DX_VERSION: "0.7.7" # 与本地 dx --version 对齐
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # tag 推送 → 双平台；workflow_dispatch → 按 inputs.platform 过滤
    if: >-
      github.event_name == 'push'
      || github.event.inputs.platform == 'all'
      || github.event.inputs.platform == matrix.platform_key
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M 系列)：原生构建，无需 cross
          # bundle_globs：当前 OS 允许进 artifact 的产物扩展名（空格分隔）。
          # 严格按 OS 白名单，避免 checkout 自带的 macOS .dmg / .app 混进 Windows 包，反之亦然。
          - label: macOS-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            bundle_globs: "*.dmg"
            platform_key: mac
          # Windows x86_64：MSVC runner 原生构建
          # dx 0.7 默认走 NSIS 而不是 WiX/MSI，bundle 落点是
          #   target\dx\desktop\bundle\windows\nsis\<bundle_name>_<ver>_x64-setup.exe
          # 这里只白名单 `*-setup.exe`（NSIS 安装器固定后缀），自然挡掉同目录下
          # cargo 直出的裸 `desktop.exe`（未做任何安装器封装，不应作为分发件）。
          - label: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_globs: "*-setup.exe"
            platform_key: windows

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # release profile 是 lto + codegen-units=1，首次会很慢，命中后能省 10+ 分钟
          shared-key: desktop-${{ matrix.target }}

      # 直接下载 Dioxus GitHub Release 里官方编译好的 `dx` 二进制。
      # 不走 cargo-binstall + cargo install 的源码回退，避免 `auth-git2` / `git2` 版本漂移把编译打挂
      # （0.7.7 在 binstall 元数据下匹配不到 release 资产名，会回退到 `cargo install` 然后编译失败）。
      - name: Install dioxus-cli ${{ env.DX_VERSION }} (prebuilt)
        shell: bash
        env:
          DX_VERSION: ${{ env.DX_VERSION }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            aarch64-apple-darwin)   ASSET="dx-aarch64-apple-darwin.tar.gz" ;;
            x86_64-pc-windows-msvc) ASSET="dx-x86_64-pc-windows-msvc.zip" ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac
          URL="https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/${ASSET}"
          INSTALL_DIR="$HOME/.dx"
          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"
          cd "$INSTALL_DIR"
          echo "Downloading $URL"
          # GitHub Release CDN（CloudFront / Akamai）偶发 504 Gateway Timeout，
          # 默认 `--retry 3 --retry-delay 2` 6 秒就放弃太弱；加大次数 + 间隔，
          # `--retry-all-errors` 让 HTTP 5xx 也走 retry（curl 7.71+）。
          # 总 retry 时长封顶 5 分钟，避免极端故障把 CI 卡死。
          curl --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 300 \
               -fL -o "$ASSET" "$URL"
          case "$ASSET" in
            *.tar.gz) tar xzf "$ASSET" ;;
            *.zip)    unzip -q -o "$ASSET" ;;
          esac
          DX_PATH="$(find . -maxdepth 4 -type f \( -name 'dx' -o -name 'dx.exe' \) | head -n1)"
          if [ -z "$DX_PATH" ]; then
            echo "dx binary not found in $ASSET" >&2
            ls -R
            exit 1
          fi
          chmod +x "$DX_PATH" || true
          DX_DIR="$(cd "$(dirname "$DX_PATH")" && pwd)"
          # Windows runner 上默认 shell 是 PowerShell，不认 Git Bash 的 /c/Users/... 路径；
          # 必须用 cygpath -w 转成 C:\Users\... 写入 $GITHUB_PATH，否则后续步骤 "dx not found"。
          if [ "${RUNNER_OS:-}" = "Windows" ] && command -v cygpath >/dev/null 2>&1; then
            DX_DIR="$(cygpath -w "$DX_DIR")"
          fi
          echo "$DX_DIR" >> "$GITHUB_PATH"
          "$DX_PATH" --version

      # 仓库里曾误 commit 过本地 macOS 构建产物（desktop/dist/*.app, *.dmg），
      # checkout 后 desktop/dist 会自带一份 macOS 的 .dmg。如果不清空，
      # Stage artifacts 会把它当成"当前构建产物"一并打进 Windows 的 artifact。
      # 这里在 bundle 前强制重置 desktop/dist，保证只看到本次 dx bundle 的真实输出。
      - name: Reset desktop/dist before bundling
        shell: bash
        run: |
          rm -rf desktop/dist
          mkdir -p desktop/dist

      - name: Bundle desktop (release)
        working-directory: desktop
        # 不传 --target 让 dx 用 host 默认目标，避免 dx 0.7 在 --target 下 out_dir 路径不一致
        env:
          # 编译期注入：desktop crate 用 `option_env!("ANOTHERME_BASE_URL")` 把上游 API 写死进二进制。
          # 不注入时会 fallback 到 https://api.anotherme.co（见 ui/src/desktop/auth.rs），
          # 但显式给一份做双保险——以后想发预发 / 私有云的包，覆盖这一行就行。
          ANOTHERME_BASE_URL: https://api.anotherme.co
        run: dx bundle --release

      # GitHub Actions 不允许 step `if:` 直接引用 secrets.*；先映射到 env，再用 env.* 判空。
      - name: Detect Apple signing secrets
        if: matrix.label == 'macOS-aarch64'
        id: apple
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          echo "has_cert=${HAS_CERT}" >> "$GITHUB_OUTPUT"
          echo "has_notary=${HAS_NOTARY}" >> "$GITHUB_OUTPUT"
          echo "has_cert=${HAS_CERT}  has_notary=${HAS_NOTARY}"

      - name: Import Apple signing certificate
        if: matrix.label == 'macOS-aarch64' && steps.apple.outputs.has_cert == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "${APPLE_CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${APPLE_CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          echo "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # -A 允许所有应用访问私钥（绕开 ACL 白名单）；-t cert -f pkcs12 兼容 .p12 同时包含证书+私钥
          security import "$RUNNER_TEMP/cert.p12" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          # 把临时 keychain 放到搜索路径首位，原 login keychain 仍在路径里以便用到系统 root CA
          security list-keychain -d user -s "${KEYCHAIN}" $(security list-keychain -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${APPLE_CERTIFICATE_PASSWORD}" "${KEYCHAIN}"
          security find-identity -v -p codesigning "${KEYCHAIN}"

      - name: Sign and notarize macOS bundle (Developer ID)
        if: matrix.label == 'macOS-aarch64' && steps.apple.outputs.has_notary == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE: "1"
          # Apple 公证偶尔会排队 40-60 分钟，单步 timeout 给到 75 分钟更稳。
          NOTARIZE_POLL_MAX_SECONDS: "3600"
          # 公证真卡住时不拖垮整条流水线：签好名的 DMG 仍作为产物上传，
          # 事后用 `xcrun stapler staple` 手动补即可（联网下 Gatekeeper 仍能在线校验）。
          NOTARIZE_SOFT_FAIL: "1"
        timeout-minutes: 75
        run: bash scripts/macos-sign-notarize.sh

      - name: Ad-hoc sign macOS app and rebuild DMG (no Apple secrets)
        if: matrix.label == 'macOS-aarch64' && steps.apple.outputs.has_notary != 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find desktop/dist -maxdepth 1 -name '*.app' -type d | head -n1)"
          if [[ -z "${app}" ]]; then
            echo "::error::no .app bundle under desktop/dist"
            exit 1
          fi
          echo "Signing ${app} (ad-hoc; 配置 GitHub Secrets 后可 Developer ID + 公证)"
          codesign --force --deep --sign - "${app}"
          xattr -cr "${app}" || true
          app_name="$(basename "${app}" .app)"
          ver="$(plutil -extract CFBundleShortVersionString raw "${app}/Contents/Info.plist")"
          rm -f desktop/dist/*.dmg
          # 同步清掉 dx 直出的「带空格」DMG，避免 Stage artifacts 兜底逻辑把它也一起塞进 Release
          find target/dx -type f -name '*.dmg' -delete 2>/dev/null || true
          dmg="desktop/dist/${app_name// /_}_${ver}_aarch64.dmg"
          hdiutil create -volname "${app_name}" -srcfolder "${app}" -ov -format UDZO "${dmg}"
          ls -lh desktop/dist/

      # =========================================
      # Windows 代码签名（Azure Trusted Signing）
      # =========================================
      # 检测 Azure 凭证 + Trusted Signing 资源配置是否齐备。
      # 任一未配 → 直接跳过签名，CI 仍出未签名 MSI（不阻断发布流水线）。
      # 全配齐 → 走 OIDC 登 Azure → 调 Trusted Signing 给 MSI 盖 Authenticode 签名。
      - name: Detect Azure Trusted Signing config
        if: matrix.label == 'Windows-x86_64'
        id: az_ts
        shell: bash
        env:
          HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_TS_ACCOUNT != '' && vars.AZURE_TS_PROFILE != '' && vars.AZURE_TS_ENDPOINT != '' }}
        run: |
          echo "has_azure=${HAS_AZURE}" >> "$GITHUB_OUTPUT"
          echo "has_azure=${HAS_AZURE}"
          if [ "${HAS_AZURE}" != "true" ]; then
            echo "::warning::Azure Trusted Signing 未配齐（缺 AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID secrets 或 AZURE_TS_ACCOUNT / AZURE_TS_PROFILE / AZURE_TS_ENDPOINT vars），跳过签名"
          fi

      # dx 0.7 在 Windows 上把 NSIS 安装器同时落在两个地方：
      #   1) target\dx\desktop\bundle\windows\nsis\<bundle_name>_<ver>_x64-setup.exe
      #   2) desktop\dist\<bundle_name>_<ver>_x64-setup.exe  （dx 已经 copy 好）
      # 实际版本可能只产 (1) 不产 (2)（旧版 dx）；语义上跟 macOS 一致：dist 优先、target 兜底。
      # 关键点：不要从 desktop\dist 里把同名文件再 Copy-Item 到 desktop\dist，
      # 否则 pwsh 报 "Cannot overwrite the item ... with itself" → exit 1。
      # 注：不依赖 az_ts.has_azure——即便没配 Azure 凭证（跳过签名），
      # 也需要这个 step 给后续 Stage artifacts 报错收口（一份都没有 → fail）。
      - name: Collect NSIS installer into desktop/dist (Windows)
        if: matrix.label == 'Windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path desktop\dist | Out-Null
          $inDist = @(Get-ChildItem -Path desktop\dist -Filter *-setup.exe -ErrorAction SilentlyContinue)
          if ($inDist.Count -gt 0) {
            $inDist | ForEach-Object { Write-Host "already in desktop\dist: $($_.Name)" }
          } elseif (Test-Path target\dx) {
            $inTarget = @(Get-ChildItem -Path target\dx -Recurse -Filter *-setup.exe -ErrorAction SilentlyContinue)
            if ($inTarget.Count -eq 0) {
              Write-Error 'no NSIS installer (*-setup.exe) produced by dx bundle'
              exit 1
            }
            $inTarget | Sort-Object FullName -Unique | ForEach-Object {
              Copy-Item -Force $_.FullName -Destination desktop\dist
              Write-Host "staged for signing: $($_.FullName) -> desktop\dist\$($_.Name)"
            }
          } else {
            Write-Error 'no NSIS installer (*-setup.exe) produced by dx bundle'
            exit 1
          }
          Get-ChildItem desktop\dist -Filter *-setup.exe | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Azure login (OIDC, Windows-only)
        if: matrix.label == 'Windows-x86_64' && steps.az_ts.outputs.has_azure == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 注意：原 `Azure/trusted-signing-action` 已在 2026-01 rebrand 为
      # `Azure/artifact-signing-action`（v1 是首个 GA 版本），input 名也跟着改了
      # （旧名 trusted-signing-account-name 仍兼容，但官方推荐用 signing-account-name）。
      # files-folder-filter 是逗号分隔的扩展名白名单（"dll,exe,msix" 这种），
      # dx 0.7 在 Windows 走 NSIS 出 *.exe 安装器，所以这里 filter=exe；
      # Collect 步骤已保证 desktop\dist 里只有 *-setup.exe（没有裸 desktop.exe）。
      - name: Sign NSIS installer with Azure Artifact Signing
        if: matrix.label == 'Windows-x86_64' && steps.az_ts.outputs.has_azure == 'true'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ vars.AZURE_TS_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TS_PROFILE }}
          files-folder: desktop\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # sanity：用 PowerShell 反解每个安装器的 Authenticode 状态，
      # 如果不是 Valid 就直接 fail，避免「签名步骤没报错、但其实没签上」这种隐性故障。
      - name: Verify installer Authenticode signature
        if: matrix.label == 'Windows-x86_64' && steps.az_ts.outputs.has_azure == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          Get-ChildItem -Path desktop\dist -Filter *-setup.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "==> $($_.Name)"
            $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate | Out-String | Write-Host
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::installer signature invalid for $($_.Name): $($sig.Status) - $($sig.StatusMessage)"
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: List bundle outputs
        shell: bash
        run: |
          echo "==== desktop/dist ===="
          ls -lh desktop/dist 2>/dev/null || true
          echo "==== target/dx (兜底搜) ===="
          find target/dx -maxdepth 6 -type f \
            \( -name "*.dmg" -o -name "*.app" -o -name "*.msi" -o -name "*.exe" \
               -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) \
            -print 2>/dev/null || true

      # dx 直出的「裸」DMG / MSI 文件名带空格（如 "Pusa AI Console_0.1.0_aarch64.dmg"），
      # 未签名/未规范化命名，绝不该作为分发件上传。
      #   - macOS：签名/公证脚本 & ad-hoc 分支都会重建为「下划线版」
      #     （Pusa_AI_Console_*.dmg）并已 rm 掉原版
      #   - Windows：dx 0.7 MSI 命名是下划线版，但旧版本/未来变更不保证
      # 这里在 stage 前再扫一遍兜底：任何带空格的 dmg/msi/exe 一律删掉，
      # 避免被 Stage artifacts 的 glob 捞进去。
      - name: Strip raw/unsigned bundle artifacts with spaces
        shell: bash
        run: |
          set -euo pipefail
          for d in desktop/dist target/dx; do
            [ -d "$d" ] || continue
            find "$d" -type f \
              \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) \
              -name "* *" \
              -print -delete || true
          done

      - name: Stage artifacts
        shell: bash
        env:
          # 当前 OS 允许进 artifact 的产物扩展名（来自 matrix.bundle_globs）。
          # 严格按 OS 白名单过滤，防止 checkout 自带的异构平台产物
          # （比如本地误 commit 的 macOS .dmg）混进 Windows artifact。
          BUNDLE_GLOBS: ${{ matrix.bundle_globs }}
        run: |
          set -euo pipefail
          mkdir -p _artifacts

          # 把 "*.msi *.exe" 这种空格分隔的 glob 列表，转成 find 的
          # `\( -name "*.msi" -o -name "*.exe" \)` 表达式。
          find_expr=()
          first=1
          for g in $BUNDLE_GLOBS; do
            if [ $first -eq 1 ]; then
              find_expr+=( '(' '-name' "$g" )
              first=0
            else
              find_expr+=( '-o' '-name' "$g" )
            fi
          done
          find_expr+=( ')' )

          staged=0
          # desktop/dist 是签名/公证脚本落地的位置（macOS 上是「下划线版」的已公证 DMG）。
          # 优先从这里取，拿到后**不再**走 target/dx 兜底，避免把 dx 直出的未签名/未公证 DMG
          # （文件名带空格）一起塞进 _artifacts，造成 Release 出现两份内容不同的 DMG。
          if [ -d desktop/dist ]; then
            while IFS= read -r -d '' f; do
              cp -v "$f" _artifacts/
              staged=1
            done < <(find desktop/dist -maxdepth 2 -type f "${find_expr[@]}" -print0)
          fi
          # 兜底：仅当 desktop/dist 一份都没拿到时，才去 target/dx/desktop/bundle/<os>/ 找
          # （比如 dx 某些版本 / Windows 上产物不复制到 desktop/dist 的情况）。
          if [ "$staged" -eq 0 ] && [ -d target/dx ]; then
            find target/dx -type f "${find_expr[@]}" -exec cp -v {} _artifacts/ \;
          fi
          echo "==== staged ===="
          ls -lh _artifacts || true
          test -n "$(ls -A _artifacts 2>/dev/null)" || { echo "::error::no artifacts produced"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: _artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: bundle
    # tag 推送，或 workflow_dispatch 传了 release_tag
    if: >-
      success()
      && (
        startsWith(github.ref, 'refs/tags/desktop-v')
        || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp -v {} release/ \;
          ls -lh release
          test -n "$(ls -A release 2>/dev/null)" || { echo "::error::no artifacts for release"; exit 1; }

      # softprops/action-gh-release@v2 默认是 upsert：同名 asset 替换，
      # 但**老 asset 中没有同名对应的**会一直挂在 Release 上不清。
      # 同 tag 重跑 workflow（如修包后 redeploy desktop-v0.1.0）时，
      # 上次的「带空格 DMG」、上次的 desktop.exe 会一直残留。
      # 上传前先把已有 assets 全部删干净，保证 Release 只剩本次产物。
      # 注意：GitHub 自动生成的 "Source code (zip/tar.gz)" 是平台行为，
      # 不属于 assets，无法通过 API 删除。
      #
      # 单平台发版（release-mac / release-windows）时：只删「本平台」产物，
      # 保留另一平台已有 asset，避免互相覆盖。
      - name: Purge existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 不存在，跳过 purge"
            exit 0
          fi
          gh release view "$TAG" --json assets -q '.assets[].name' \
            | while IFS= read -r name; do
                [ -n "$name" ] || continue
                case "$PLATFORM" in
                  mac)
                    [[ "$name" == *.dmg ]] || continue
                    ;;
                  windows)
                    [[ "$name" == *-setup.exe || "$name" == *.msi ]] || continue
                    ;;
                  all|*)
                    ;;
                esac
                echo "delete asset: $name"
                gh release delete-asset "$TAG" "$name" --yes || true
              done

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
