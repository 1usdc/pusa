<!DOCTYPE html>
<html>
<head>
    <title>Pusa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 冷启动：居中加载动画，遮住 WebView/Dioxus 首帧错版闪屏 -->
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #f8fafc;
        }
        #main {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }
        #ac-desktop-boot-skel {
            position: fixed;
            inset: 0;
            z-index: 2147483000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            background: #f8fafc;
            opacity: 1;
            transition: opacity 0.28s ease;
            pointer-events: none;
        }
        #ac-desktop-boot-skel.is-done {
            opacity: 0;
        }
        .ac-boot-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.15rem;
        }
        .ac-boot-spinner {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 50%;
            border: 2.5px solid #e2e8f0;
            border-top-color: #181c23;
            animation: ac-boot-spin 0.75s linear infinite;
        }
        .ac-boot-name {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 1.05rem;
            font-weight: 650;
            letter-spacing: 0.04em;
            color: #181c23;
        }
        @keyframes ac-boot-spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .ac-boot-spinner { animation: none; border-top-color: #181c23; }
            #ac-desktop-boot-skel { transition: none; }
        }
    </style>
</head>
<body>
    <div id="ac-desktop-boot-skel" aria-busy="true" aria-label="正在启动">
        <div class="ac-boot-stage">
            <div class="ac-boot-spinner"></div>
            <div class="ac-boot-name">Pusa</div>
        </div>
    </div>
    <div id="main"></div>
    <script>
        window.__pusaBootAt = Date.now();
        setTimeout(function () {
            var el = document.getElementById("ac-desktop-boot-skel");
            if (el) el.remove();
        }, 12000);
    </script>
</body>
</html>
