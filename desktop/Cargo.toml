[package]
name = "desktop"
version = "1.1.2"
edition = "2021"
description = "Desktop entry (Dioxus desktop / system WebView)"

[dependencies]
image = "0.25"
dioxus = { version = "0.7.9", default-features = false, features = [
    "launch",
    "devtools",
    "logger",
    "lib",
    "desktop",
    "macro",
    "html",
    "signals",
    "hooks",
    "document",
    "asset",
] }
ui = { path = "../ui", default-features = false, features = ["native"] }
# 自动更新：安装器 / 增量包 / 重启应用（打包见 scripts/velopack-pack-*.sh）
velopack = "1.2"

# 开发态 Dock 图标：裸 `cargo run` / `just desktop` 无 .app 包时，需 AppKit 设置。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSImage",
    "NSDockTile",
    "NSView",
    "NSResponder",
    "NSControl",
    "NSImageView",
    "NSCell",
] }

[[bin]]
# dx bundle 的 Windows 产品名 / 安装器文件名是 bin 名的 PascalCase。
# 保持 Pusa，安装器才是 Pusa_x.y.z_x64-setup.exe（而不是 Desktop_…）。
name = "Pusa"
path = "src/main.rs"
